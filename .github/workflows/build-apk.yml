name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npm run android:sync
      - name: Make Gradle download more reliable
        run: |
          f=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=.*/networkTimeout=180000/' $f
          sed -i 's/-all\.zip/-bin.zip/' $f
          cat $f
      - name: Build APK (retry on network errors)
        run: |
          cd android
          for i in 1 2 3 4 5; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Attempt $i failed; retrying in 30s..."
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
