name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npm run android:sync

      # دانلود Gradle با چند آدرس جایگزین و تلاش مجدد (دانلود خودکار wrapper گاهی تایم‌اوت می‌شود)
      - name: Download Gradle (with mirrors and retries)
        run: |
          V=8.11.1
          OUT=$HOME/gradle-$V-bin.zip
          URLS=(
            "https://services.gradle.org/distributions/gradle-$V-bin.zip"
            "https://downloads.gradle.org/distributions/gradle-$V-bin.zip"
            "https://github.com/gradle/gradle-distributions/releases/download/v$V/gradle-$V-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip"
            "https://mirrors.aliyun.com/gradle/gradle-$V-bin.zip"
          )
          ok=0
          for round in 1 2 3; do
            for u in "${URLS[@]}"; do
              echo "Trying $u"
              rm -f "$OUT"
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 -o "$OUT" "$u" && unzip -tq "$OUT" >/dev/null 2>&1; then
                ok=1; break 2
              fi
            done
            echo "Round $round failed, waiting 20s"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "Could not download Gradle"; exit 1; }
          ls -la "$OUT"
          f=android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\\\:$OUT#" $f
          sed -i 's/networkTimeout=.*/networkTimeout=180000/' $f
          cat $f

      - name: Build APK (retry on network errors)
        run: |
          cd android
          for i in 1 2 3 4 5; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Attempt $i failed; retrying in 30s..."
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
